[package]
name = "mixer-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WASM bindings for the oximedia-mixer audio engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oximedia-core.workspace = true
oximedia-audio.workspace = true
oximedia-mixer.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true

[dev-dependencies]
# 0.3.x required: 0.2.x ended at 0.2.50, which registers zero tests against
# wasm-bindgen 0.2.127 ("no tests to run!"). 0.3.77 pins wasm-bindgen =0.2.127.
wasm-bindgen-test = "0.3"
