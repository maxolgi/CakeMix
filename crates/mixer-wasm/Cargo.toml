[package]
name = "mixer-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WASM bindings for the oximedia-mixer audio engine"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oximedia-core.workspace = true
oximedia-audio.workspace = true
oximedia-mixer.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true

# Pure-Rust libm for the wasm-only math shims in src/gxfx.rs: on
# wasm32-unknown-unknown std's f32/f64 math methods lower to LLVM
# intrinsics that become calls to the very C symbols the shims define,
# so the shims must delegate to libm (never std) or they recurse
# forever at runtime.
[target.'cfg(target_arch = "wasm32")'.dependencies]
libm = "0.2"

[dev-dependencies]
# 0.3.x required: 0.2.x ended at 0.2.50, which registers zero tests against
# wasm-bindgen 0.2.127 ("no tests to run!"). 0.3.77 pins wasm-bindgen =0.2.127.
wasm-bindgen-test = "0.3"
# Native tests parse the manual-JSON builders' output for real (scene_test.rs
# round-trips console_params_json_inner through it). Test-only; never linked
# into the wasm artifact.
serde_json = "1"
