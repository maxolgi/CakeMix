[package]
name = "cakemix-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Web server for the CakeMix WASM audio mixer demo"

[[bin]]
name = "cakemix"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
# Web/HTTPS cert generation (13-month self-signed PEM).
rcgen = "0.14"
# Parse the persisted web cert's expiry + SANs for the reuse check.
x509-parser = "0.18"
time = "0.3"
# Validate the persisted key PEM before handing it to rustls.
rustls-pki-types = "1"
# Process-default crypto provider for the TLS acceptor (see the install in
# spawn_web_server): axum-server (aws-lc-rs) + reqwest (ring) both link rustls
# providers, so ring must be installed explicitly or TLS mode panics.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
anyhow = "1"
open = "5"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = "0.3"
# Server-side fetch of remote gateways' cert-hash.js (the browser cannot
# fetch another origin's cert-hash.js — CORS — so this server proxies it).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2"
