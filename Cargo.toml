[workspace]
resolver = "2"
members = ["crates/mixer-wasm", "crates/cakemix-server"]
# vendor/WebSRT is its own cargo workspace (git submodule); excluding it lets
# its crates inherit from THEIR workspace root when pulled in as path deps.
exclude = ["vendor/WebSRT"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
rust-version = "1.95"

[workspace.dependencies]
oximedia-core = { version = "0.2", default-features = false, features = ["wasm"] }
oximedia-audio = { version = "0.2", default-features = false }
oximedia-mixer = { version = "0.2", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }

[patch.crates-io]
# Patch: all three oximedia crates from our fork to keep versions unified.
# LOCAL DEV: path patch into ~/oximedia (has process_mix_rt, unpushed).
# When maxolgi/oximedia master is pushed, revert these three to:
#   { git = "https://github.com/maxolgi/oximedia", branch = "master" }
oximedia-mixer = { path = "/home/flibb/oximedia/crates/oximedia-mixer" }
oximedia-core = { path = "/home/flibb/oximedia/crates/oximedia-core" }
oximedia-audio = { path = "/home/flibb/oximedia/crates/oximedia-audio" }
# Patch: WebSRT's forked transports (copied from vendor/WebSRT/Cargo.toml —
# patches do not cross workspaces). Required by the websrt library crate.
srt-protocol = { git = "https://github.com/maxolgi/srt-rs.git", branch = "main" }
srt-tokio = { git = "https://github.com/maxolgi/srt-rs.git", branch = "main" }
mpeg2ts = { git = "https://github.com/maxolgi/mpeg2ts.git", branch = "master" }
