[workspace]
resolver = "2"
members = ["crates/mixer-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
oximedia-core = { version = "0.2", default-features = false, features = ["wasm"] }
oximedia-audio = { version = "0.2", default-features = false }
oximedia-mixer = { version = "0.2", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }

# Patch: make oxifft's threading (rayon) non-default so it compiles on wasm32.
# Real-time audio is single-threaded; we never want oxifft's threading on any target.
[patch.crates-io]
oxifft = { path = "vendor/oxifft/oxifft" }
# Patch: use our fork where rayon is optional behind the 'parallel' feature.
oximedia-mixer = { git = "https://github.com/maxolgi/oximedia", branch = "master" }
