; Production supervisord config for the cakemix server (front.vyidd.com).
; Deploy: copy to /etc/supervisor/conf.d/cakemix.conf, then
;   supervisorctl reread && supervisorctl update && supervisorctl restart cakemix
;
; Web + reference web UI bind loopback (nginx terminates TLS for
; cakemix.vyidd.com and proxies to :8200); the WebTransport listener is the
; only externally bound UDP port (14433). PKI identity from Let's Encrypt —
; cert-hash.js advertises CERT_HASH = null. The key must be readable by
; www-data: 0640 root:ssl-cert on
; /etc/letsencrypt/archive/cakemix.vyidd.com/privkey*.pem — the certbot
; deploy hook /etc/letsencrypt/renewal-hooks/deploy/restart-websrt.sh
; re-fixes perms on renewal and restarts cakemix + websrt.
[program:cakemix]
command=/opt/cakemix/cakemix --bind 127.0.0.1 --port 8200 --wt-port 14433 --srt-port 19000 --web-port 8201 --web-bind 127.0.0.1 --latency-ms 1000 --cert-pem /etc/letsencrypt/live/cakemix.vyidd.com/fullchain.pem --key-pem /etc/letsencrypt/live/cakemix.vyidd.com/privkey.pem
directory=/var/lib/cakemix
user=www-data
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/cakemix/app.out.log
stderr_logfile=/var/log/cakemix/app.err.log
