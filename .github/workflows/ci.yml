name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack

      # Scoped to workspace members, not `--all`: rustfmt follows the
      # cakemix-server path dependency into vendor/WebSRT and would flag the
      # pinned submodule (formatted by an older rustfmt — not ours to fix).
      - name: Check formatting
        run: cargo fmt -p mixer-wasm -p cakemix-server -- --check

      - name: Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Build native
        run: cargo build --verbose

      - name: Run native tests
        run: cargo test --verbose

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown -p mixer-wasm

      - name: Build WASM (wasm-pack web)
        run: cd crates/mixer-wasm && wasm-pack build --target web --release

      - name: Build WASM (wasm-pack nodejs)
        run: cd crates/mixer-wasm && wasm-pack build --target nodejs --release

      - name: Run WASM tests
        run: cd crates/mixer-wasm && node tests/run_tests.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Stages the WebSRT wasm into vendor/WebSRT/web/wasm/ — must run before
      # the Vite build below, which bundles the submodule's receive worker.
      - name: Build WebSRT WASM (submodule)
        run: bash build/build-websrt-wasm.sh

      # Proves the frontend build works end-to-end. web/assets is committed
      # build output; bundle hashes may legitimately differ, so this step
      # deliberately does NOT diff the result against the checkout.
      - name: Build frontend
        working-directory: frontend
        run: npx vite build
