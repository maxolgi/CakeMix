name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast checks on every push / PR.
  #    No WASM, no web build — cakemix-server's build.rs creates the
  #    rust-embed folders when missing, so cargo compiles with empty embeds.
  # ---------------------------------------------------------------------------
  check:
    name: Lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # mixer-wasm's build.rs compiles the gxfx guitarix C++ DSP with
      # clang++ and an archiver — ar, falling back to llvm-ar or $AR
      # (vendor/guitarix is initialized by the recursive checkout above).
      # The hosted runners ship a toolchain providing these; fail fast
      # with a clear message if it is missing.
      - name: Check gxfx toolchain (clang++ / ar)
        shell: bash
        run: |
          command -v clang++ >/dev/null || { echo "::error::clang++ not found on PATH — building mixer-wasm requires the clang/LLVM toolchain (gxfx C++ DSP)"; exit 1; }
          command -v ar >/dev/null || command -v llvm-ar >/dev/null || { echo "::error::neither ar nor llvm-ar found on PATH — building mixer-wasm requires an archiver (binutils or LLVM) for the gxfx static library"; exit 1; }

      # Match rust-toolchain.toml so rustfmt output is reproducible.
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Scoped to the workspace members, not `--all`: cargo fmt would also
      # follow dependencies outside this repo and flag files that aren't
      # ours to fix.
      - name: cargo fmt --check
        run: cargo fmt -p mixer-wasm -p cakemix-server -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      # Timing gate: glitch_sim's budget assertions are release-only
      # (debug is ~13x slower — see the test file's require_release), so
      # plain `cargo test` skips them. Enforce the RT budget here instead.
      - name: cargo test (glitch_sim timing gate, release)
        run: cargo test -p mixer-wasm --release --test glitch_sim

      # gxfx interactive-op wall-time gate (same release-only pattern):
      # set_slot/enable/param-write budgets per effect — pins the
      # message-time costs measured in the 2026-10-20 E2E investigation.
      - name: cargo test (gxfx timing gate, release)
        run: cargo test -p mixer-wasm --release --test gxfx_timing_test

  # ---------------------------------------------------------------------------
  # 2. WASM tests — the known-answer DSP suite under wasm (node).
  # ---------------------------------------------------------------------------
  wasm-tests:
    name: WASM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # mixer-wasm's build.rs compiles the gxfx guitarix C++ DSP with
      # clang++ and an archiver — ar, falling back to llvm-ar or $AR
      # (vendor/guitarix is initialized by the recursive checkout above).
      # The hosted runners ship a toolchain providing these; fail fast
      # with a clear message if it is missing.
      - name: Check gxfx toolchain (clang++ / ar)
        shell: bash
        run: |
          command -v clang++ >/dev/null || { echo "::error::clang++ not found on PATH — building mixer-wasm requires the clang/LLVM toolchain (gxfx C++ DSP)"; exit 1; }
          command -v ar >/dev/null || command -v llvm-ar >/dev/null || { echo "::error::neither ar nor llvm-ar found on PATH — building mixer-wasm requires an archiver (binutils or LLVM) for the gxfx static library"; exit 1; }

      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM (wasm-pack nodejs)
        run: cd crates/mixer-wasm && wasm-pack build --target nodejs --release

      - name: Run WASM known-answer tests (node)
        run: cd crates/mixer-wasm && node tests/run_tests.mjs

      # The #[wasm_bindgen_test] suite (bus_parallel, channel_params,
      # channel_tap, known_answer, pcm_fifo) — compiled by `cargo test` but
      # only executable under wasm.
      - name: Run wasm_bindgen_test suite (node)
        run: cd crates/mixer-wasm && wasm-pack test --node --release

  # ---------------------------------------------------------------------------
  # 3. Full build — Windows, macOS (ARM).
  #    (Linux is built by build-linux below, inside the Debian trixie
  #    container — `container:` cannot be set conditionally from a matrix.)
  #    Each matrix entry builds the QuicSRT engine → WASM → web/ → server
  #    binary independently, because rust-embed embeds web/ (incl. the staged
  #    engine at web/build/) and crates/mixer-wasm/pkg at compile time.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            binary: cakemix.exe
            artifact: cakemix-windows-x64
          - name: macOS ARM
            os: macos-latest
            binary: cakemix
            artifact: cakemix-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # mixer-wasm's build.rs compiles the gxfx guitarix C++ DSP with
      # clang++ and an archiver — ar, falling back to llvm-ar or $AR
      # (vendor/guitarix is initialized by the recursive checkout above).
      # Apple's clang++ has no WebAssembly backend, so on macOS build.rs
      # probes compilers and falls back to the emsdk clang installed two
      # steps below. The hosted runners ship a toolchain providing these;
      # fail fast with a clear message if it is missing.
      - name: Check gxfx toolchain (clang++ / ar)
        shell: bash
        run: |
          command -v clang++ >/dev/null || { echo "::error::clang++ not found on PATH — building mixer-wasm requires the clang/LLVM toolchain (gxfx C++ DSP)"; exit 1; }
          command -v ar >/dev/null || command -v llvm-ar >/dev/null || { echo "::error::neither ar nor llvm-ar found on PATH — building mixer-wasm requires an archiver (binutils or LLVM) for the gxfx static library"; exit 1; }

      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack (Unix)
        if: runner.os != 'Windows'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install wasm-pack (Windows)
        if: runner.os == 'Windows'
        run: cargo install wasm-pack --locked

      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Step 1: emsdk — build.sh sources ~/emsdk/emsdk_env.sh, so emsdk must
      # live at exactly that path. 6.0.8 is the toolchain the port was built
      # and byte-parity-verified with (mirrors vendor/QuicSRT-wasm's CI).
      - name: Install Emscripten
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 6.0.8
          "$HOME/emsdk/emsdk" activate 6.0.8

      # Step 2: QuicSRT engine (emcc: libquicsrt receiver-only + the srt fork
      # + the single engine module) → vendor/QuicSRT-wasm/build/.
      - name: Build QuicSRT engine
        shell: bash
        run: cd vendor/QuicSRT-wasm && ./build.sh setup && ./build.sh lib && ./build.sh engine

      # Step 3: mixer wasm pkg (AudioWorklet glue) → crates/mixer-wasm/pkg.
      - name: Build mixer WASM pkg (wasm-pack web)
        shell: bash
        run: cd crates/mixer-wasm && wasm-pack build --target web --release

      # Step 4: stage the engine into web/build/ BEFORE Vite runs: the
      # bundles keep /build/srt_engine.mjs external (vite has
      # emptyOutDir: false, so it won't wipe web/build/) — the emcc module
      # must stay standalone (self-imports for pthreads, fetches its .wasm
      # relative to itself). Same staging `make build-ui` does.
      - name: Stage QuicSRT engine into web/build
        shell: bash
        run: |
          mkdir -p web/build
          cp vendor/QuicSRT-wasm/build/srt_engine.mjs vendor/QuicSRT-wasm/build/srt_engine.wasm web/build/

      # Step 5: frontend → web/ (gitignored, generated) + worklet bundle.
      - name: Build frontend (npm ci + vite)
        shell: bash
        working-directory: frontend
        run: |
          npm ci
          npx vite build

      - name: Build mixer worklet
        shell: bash
        run: node build/build-worklet.cjs

      # Step 6: server binary — embeds web/ (incl. web/build/) and pkg/.
      - name: Build server binary
        run: cargo build --release -p cakemix-server

      - name: Strip binary (Unix only)
        if: runner.os != 'Windows'
        run: strip target/release/${{ matrix.binary }}

      - name: Upload server binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. Linux build — Debian 13 (trixie) container, glibc 2.41.
  #    ubuntu-latest images carry a newer glibc (2.42), which would raise the
  #    binary's minimum requirement above Debian stable. Building inside
  #    debian:trixie caps it at glibc 2.41, and cargo-deb's $auto depends
  #    resolve against trixie's library versions via dpkg-shlibdeps.
  #    Unlike SlopShady's trixie job there are no GUI/openssl packages here:
  #    cakemix-server is a headless axum server on rustls (reqwest
  #    default-features = false), but clang is added for mixer-wasm's gxfx
  #    guitarix C++ DSP (build.rs).
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build (Linux x64)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      # Must precede checkout: git is not in the base image and checkout falls
      # back to a REST download (no submodules) without it.
      - name: Install build deps (Debian trixie)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 xz-utils \
            build-essential cmake ninja-build pkg-config clang
          ldd --version | head -n 1

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # mixer-wasm's build.rs compiles the gxfx guitarix C++ DSP with
      # clang++ and an archiver — ar, falling back to llvm-ar or $AR
      # (vendor/guitarix is initialized by the recursive checkout above).
      # Fail fast with a clear message if the toolchain is missing.
      - name: Check gxfx toolchain (clang++ / ar)
        shell: bash
        run: |
          command -v clang++ >/dev/null || { echo "::error::clang++ not found on PATH — building mixer-wasm requires the clang/LLVM toolchain (gxfx C++ DSP)"; exit 1; }
          command -v ar >/dev/null || command -v llvm-ar >/dev/null || { echo "::error::neither ar nor llvm-ar found on PATH — building mixer-wasm requires an archiver (binutils or LLVM) for the gxfx static library"; exit 1; }

      # dtolnay/rust-toolchain assumes rustup is preinstalled (true on GH
      # runners, not in the bare container), so install rustup directly.
      # 1.95 + wasm32-unknown-unknown mirror rust-toolchain.toml / the
      # toolchain pins in the other jobs.
      - name: Install Rust (1.95 + wasm32 target)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.95
          . "$HOME/.cargo/env"
          rustup target add wasm32-unknown-unknown
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # build.sh sources ~/emsdk/emsdk_env.sh, so emsdk must live at exactly
      # that path. 6.0.8 is the toolchain the port was built and
      # byte-parity-verified with (mirrors vendor/QuicSRT-wasm's CI).
      - name: Install Emscripten (emsdk 6.0.8)
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 6.0.8
          "$HOME/emsdk/emsdk" activate 6.0.8

      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # Same chain as the build matrix: engine → wasm pkg → stage → frontend
      # → worklet → server (rust-embed compiles the web/ tree in).
      - name: Build QuicSRT engine
        run: cd vendor/QuicSRT-wasm && ./build.sh setup && ./build.sh lib && ./build.sh engine

      - name: Build mixer WASM pkg (wasm-pack web)
        run: cd crates/mixer-wasm && wasm-pack build --target web --release

      - name: Stage QuicSRT engine into web/build
        run: |
          mkdir -p web/build
          cp vendor/QuicSRT-wasm/build/srt_engine.mjs vendor/QuicSRT-wasm/build/srt_engine.wasm web/build/

      - name: Build frontend (npm ci + vite)
        working-directory: frontend
        run: |
          npm ci
          npx vite build

      - name: Build mixer worklet
        run: node build/build-worklet.cjs

      - name: Build server binary
        run: cargo build --release -p cakemix-server

      - name: Strip binary
        run: strip target/release/cakemix

      - name: Upload server binary
        uses: actions/upload-artifact@v7
        with:
          name: cakemix-linux-x64
          path: target/release/cakemix
          if-no-files-found: error

      # web/ is platform-agnostic — uploaded once, from this job (the only
      # Linux one left).
      - name: Upload web dist
        uses: actions/upload-artifact@v7
        with:
          name: cakemix-web-dist
          path: web/
          if-no-files-found: error

      # .deb package (binary already built, --no-build skips rebuild). $auto
      # depends resolve against trixie via dpkg-shlibdeps (from
      # build-essential); metadata lives in cakemix-server's Cargo.toml
      # ([package.metadata.deb]).
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        run: cargo deb -p cakemix-server --no-build

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: cakemix-deb
          path: target/debian/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 5. Publish a GitHub Release for every successful build.
  #    - Push to master  → release tagged dev-<short_sha>, marked "latest"
  #      (regular release, not a prerelease: GitHub ignores make_latest on
  #      pre-releases, so the dev build would never get the Latest badge)
  #    - v* tag push     → stable release tagged <version>, marked "latest"
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [build, build-linux, wasm-tests]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release
          cp artifacts/cakemix-linux-x64/cakemix       release/cakemix-linux
          cp artifacts/cakemix-windows-x64/cakemix.exe release/cakemix-windows.exe
          cp artifacts/cakemix-macos-arm64/cakemix     release/cakemix-macos
          cp artifacts/cakemix-deb/*.deb               release/
          (cd artifacts/cakemix-web-dist && zip -r "$GITHUB_WORKSPACE/release/cakemix-web-dist.zip" .)

      - name: Set release metadata
        id: meta
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          short="${SHA:0:7}"
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "tag=${REF#refs/tags/}"    >> "$GITHUB_OUTPUT"
            echo "name=${REF#refs/tags/}"   >> "$GITHUB_OUTPUT"
            echo "prerelease=false"         >> "$GITHUB_OUTPUT"
            echo "make_latest=true"         >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${short}"         >> "$GITHUB_OUTPUT"
            echo "name=Dev ${short}"        >> "$GITHUB_OUTPUT"
            echo "prerelease=false"         >> "$GITHUB_OUTPUT"
            echo "make_latest=true"         >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
