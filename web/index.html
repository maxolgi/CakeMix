<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CakeMix — WASM Audio Mixer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>🍰 CakeMix</h1>
            <p>Professional WASM Audio Mixer — M1 Demo</p>
            <p id="status">Loading WASM…</p>
        </header>

        <div class="controls">
            <button id="start-btn" disabled>Initializing…</button>
        </div>

        <div class="mixer-console">
            <!-- Channel Strips -->
            <div class="channel-strip" data-ch="0">
                <h3>CH 1</h3>
                <p class="freq">220 Hz</p>
                <div class="knob-group">
                    <label>Gain</label>
                    <input type="range" id="ch0-gain" min="0" max="1.5" step="0.01" value="1.0" class="slider">
                    <span id="ch0-gain-val" class="value">1.00</span>
                </div>
                <div class="knob-group">
                    <label>Pan</label>
                    <input type="range" id="ch0-pan" min="-1" max="1" step="0.01" value="0" class="slider">
                    <span id="ch0-pan-val" class="value">0.00</span>
                </div>
                <button id="ch0-mute" class="mute-btn">Mute</button>
            </div>

            <div class="channel-strip" data-ch="1">
                <h3>CH 2</h3>
                <p class="freq">277 Hz</p>
                <div class="knob-group">
                    <label>Gain</label>
                    <input type="range" id="ch1-gain" min="0" max="1.5" step="0.01" value="1.0" class="slider">
                    <span id="ch1-gain-val" class="value">1.00</span>
                </div>
                <div class="knob-group">
                    <label>Pan</label>
                    <input type="range" id="ch1-pan" min="-1" max="1" step="0.01" value="-0.5" class="slider">
                    <span id="ch1-pan-val" class="value">-0.50</span>
                </div>
                <button id="ch1-mute" class="mute-btn">Mute</button>
            </div>

            <div class="channel-strip" data-ch="2">
                <h3>CH 3</h3>
                <p class="freq">330 Hz</p>
                <div class="knob-group">
                    <label>Gain</label>
                    <input type="range" id="ch2-gain" min="0" max="1.5" step="0.01" value="1.0" class="slider">
                    <span id="ch2-gain-val" class="value">1.00</span>
                </div>
                <div class="knob-group">
                    <label>Pan</label>
                    <input type="range" id="ch2-pan" min="-1" max="1" step="0.01" value="0.5" class="slider">
                    <span id="ch2-pan-val" class="value">0.50</span>
                </div>
                <button id="ch2-mute" class="mute-btn">Mute</button>
            </div>

            <div class="channel-strip" data-ch="3">
                <h3>CH 4</h3>
                <p class="freq">440 Hz</p>
                <div class="knob-group">
                    <label>Gain</label>
                    <input type="range" id="ch3-gain" min="0" max="1.5" step="0.01" value="1.0" class="slider">
                    <span id="ch3-gain-val" class="value">1.00</span>
                </div>
                <div class="knob-group">
                    <label>Pan</label>
                    <input type="range" id="ch3-pan" min="-1" max="1" step="0.01" value="0" class="slider">
                    <span id="ch3-pan-val" class="value">0.00</span>
                </div>
                <button id="ch3-mute" class="mute-btn">Mute</button>
            </div>

            <!-- Master Section -->
            <div class="master-strip">
                <h3>MASTER</h3>
                <div class="knob-group">
                    <label>Master</label>
                    <input type="range" id="master" min="0" max="1.5" step="0.01" value="1.0" class="slider">
                    <span id="master-val" class="value">1.00</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
