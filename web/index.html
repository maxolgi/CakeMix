<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CakeMix — WASM Audio Mixer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
    <header>
        <div class="brand">
            <h1>🍰 CakeMix</h1>
            <span class="subtitle">WASM Audio Mixer</span>
        </div>
        <div class="header-right">
            <span id="wasm-badge" class="badge">WASM LOADING…</span>
            <span id="status" class="status">Loading…</span>
        </div>
    </header>

    <div class="transport-bar">
        <button id="start-btn" class="btn btn-start" disabled>Start</button>
        <button id="stop-btn" class="btn btn-stop" disabled>Stop</button>
        <div class="master-meters">
            <div class="h-meter-row"><span class="h-meter-label">L</span><div class="h-meter-track"><div id="meter-l" class="h-meter-bar"></div></div></div>
            <div class="h-meter-row"><span class="h-meter-label">R</span><div class="h-meter-track"><div id="meter-r" class="h-meter-bar"></div></div></div>
            <span id="meter-text" class="meter-readout">—</span>
            <span id="clip-indicator" class="clip">CLIP</span>
        </div>
    </div>

    <div id="mixer-console" class="mixer-console"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
