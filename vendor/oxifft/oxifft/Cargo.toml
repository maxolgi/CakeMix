[package]
name = "oxifft"
description = "Pure Rust implementation of FFTW - the Fastest Fourier Transform in the West"
version = "0.3.2"
edition = "2021"
authors = ["COOLJAPAN OU (Team KitaSan)"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxifft"
homepage = "https://github.com/cool-japan/oxifft"
documentation = "https://docs.rs/oxifft"
readme = "README.md"
rust-version = "1.75"
keywords = ["fft", "fftw", "dft", "signal-processing", "simd"]
categories = ["algorithms", "science", "mathematics"]
exclude = [
    "benches/",
    "tests/",
    "fuzz/",
    "proptest-regressions/",
    ".github/",
    "docs/",
    "scripts/",
    "BENCHMARK_RESULTS_TEMPLATE.md",
    "BENCHMARKING.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "PERFORMANCE_ANALYSIS.md",
    "PROJECT_STATUS.md",
    "TESTING.md",
    "TODO.md",
    "oxifft.md",
]

[dependencies]
num-complex = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", optional = true }
seahash = "4.1"
hashbrown = "0.17"
spin = { version = "0.12", default-features = false, features = ["spin_mutex", "rwlock", "once", "lazy"] }
libm = "0.2"
rayon = { version = "1.12", optional = true }
mpi = { version = "0.8", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
oxifft-codegen = { version = "0.3.1", path = "../oxifft-codegen" }
oxicuda-driver = { version = "0.1.8", optional = true }
oxicuda-fft = { version = "0.1.8", optional = true }
oxicuda-metal = { version = "0.1.8", optional = true }
ndarray = { version = "0.17.2", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.11"
approx = "0.5"
rustfft = "6.4"

[features]
default = ["std"]
# Standard library support (enables file I/O, timing, etc.)
std = ["dep:serde_json", "num-complex/std", "num-traits/std", "serde/std"]
# Threading support (requires std)
threading = ["std", "dep:rayon"]
simd = []
avx512 = []
# Quad-precision (128-bit) floating-point support (pure Rust)
f128-support = []
# Half-precision (16-bit) floating-point support (pure Rust)
f16-support = []
# MPI distributed computing support (requires MPI library)
mpi = ["dep:mpi"]
# Sparse FFT support (O(k log n) for k-sparse signals)
sparse = []
# Pruned FFT support (partial input/output computation)
pruned = []
# ARM SVE (Scalable Vector Extension) support
sve = []
# WebAssembly support
wasm = ["dep:wasm-bindgen", "dep:js-sys"]
# Streaming FFT support (STFT, window functions, overlap-add)
streaming = []
# Compile-time FFT with const generics
const-fft = []
# GPU support (CUDA backend for NVIDIA GPUs)
cuda = ["dep:oxicuda-driver", "dep:oxicuda-fft"]
# GPU support (Metal backend for Apple GPUs)
metal = ["dep:oxicuda-metal"]
# GPU support (enables both CUDA and Metal when available)
gpu = ["cuda", "metal"]
# Signal processing: Hilbert transform, PSD (Welch's method), cepstral analysis
signal = ["std"]
# FFTW-compatible API surface (thin wrappers with FFTW-style names)
fftw-compat = []
# ndarray integration — FFT extension traits for ndarray arrays
ndarray = ["dep:ndarray"]

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[package.metadata.cargo-udeps.ignore]
normal = ["oxifft-codegen", "spin"]
development = ["approx", "proptest"]

[[bin]]
name = "oxifft_tune"
path = "src/bin/oxifft_tune.rs"
required-features = ["std"]

[[bench]]
name = "dft_1d"
harness = false

[[bench]]
name = "cooley_tukey_scaling"
harness = false

[[bench]]
name = "multidim_parallel"
harness = false
required-features = ["threading"]

[[bench]]
name = "beyond_fftw"
harness = false
required-features = ["sparse", "pruned", "streaming", "const-fft"]

[[bench]]
name = "prime_sizes"
harness = false

[[bench]]
name = "gpu_vs_cpu"
harness = false
required-features = ["gpu"]

[[bench]]
name = "dct_benchmarks"
harness = false

[[example]]
name = "sparse_fft"
required-features = ["sparse"]

[[example]]
name = "streaming_fft"
required-features = ["streaming"]

[[example]]
name = "signal_processing"
required-features = ["signal"]
