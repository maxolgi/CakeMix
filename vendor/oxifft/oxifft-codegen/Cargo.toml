[package]
name = "oxifft-codegen"
description = "Procedural macro crate for OxiFFT codelet generation"
version = "0.3.2"
edition = "2021"
authors = ["COOLJAPAN OU (Team KitaSan)"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxifft"
homepage = "https://github.com/cool-japan/oxifft"
documentation = "https://docs.rs/oxifft-codegen"
readme = "README.md"
rust-version = "1.75"
keywords = ["fft", "codegen", "proc-macro", "simd"]
categories = ["development-tools::procedural-macro-helpers"]
exclude = [
    "benches/",
    "tests/",
    "fuzz/",
    ".github/",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "TODO.md",
]

[lib]
proc-macro = true

[dependencies]
oxifft-codegen-impl = { version = "0.3.2", path = "../oxifft-codegen-impl" }
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing"] }

[features]
# Matches the `avx512` feature of the `oxifft` consumer crate. The
# `gen_simd_codelet!` macro emits `#[cfg(feature = "avx512")]`, which is
# resolved against the crate that invokes the macro — so the codegen tests
# need this feature declared to avoid `unexpected_cfgs` warnings. Default-off;
# enable with `--features avx512` to compile and exercise the AVX-512 codelets.
avx512 = []

[dev-dependencies]
oxifft-codegen-impl = { version = "0.3.2", path = "../oxifft-codegen-impl" }
trybuild = "1.0"
num-complex = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
criterion = { version = "0.8", features = ["html_reports"] }
proc-macro2 = "1.0"
quote = "1.0"

[[bench]]
name = "codegen_time_stub"
harness = false

[[bench]]
name = "codegen_time"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
